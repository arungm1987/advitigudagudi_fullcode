AWSTemplateFormatVersion: "2010-09-09"

Description: Advitigudagudi Frontend Hosting Infrastructure

Parameters:
  EnvironmentName:
    Type: String

  DomainName:
    Type: String

Resources:
  #########################################################
  # S3 Bucket
  #########################################################

  FrontendBucket:
    Type: AWS::S3::Bucket

    Properties:
      BucketName: !Ref DomainName

      VersioningConfiguration:
        Status: Enabled

  #########################################################
  # CloudFront Origin Access Control
  #########################################################

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl

    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvironmentName}-frontend-oac"

        OriginAccessControlOriginType: s3

        SigningBehavior: always

        SigningProtocol: sigv4

  #########################################################
  # CloudFront Distribution
  #########################################################

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution

    Properties:
      DistributionConfig:
        Enabled: true

        HttpVersion: http2

        DefaultRootObject: index.html

        PriceClass: PriceClass_100

        Origins:
          - Id: FrontendS3Origin

            DomainName: !GetAtt FrontendBucket.RegionalDomainName

            S3OriginConfig: {}

            OriginAccessControlId: !GetAtt FrontendOAC.Id

        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin

          ViewerProtocolPolicy: redirect-to-https

          AllowedMethods:
            - GET
            - HEAD

          CachedMethods:
            - GET
            - HEAD

          Compress: true

          ForwardedValues:
            QueryString: false

            Cookies:
              Forward: none

        CustomErrorResponses:
          - ErrorCode: 403

            ResponseCode: 200

            ResponsePagePath: /index.html

          - ErrorCode: 404

            ResponseCode: 200

            ResponsePagePath: /index.html

        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  #########################################################
  # Bucket Policy
  #########################################################

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy

    Properties:
      Bucket: !Ref FrontendBucket

      PolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Sid: AllowCloudFrontAccess

            Effect: Allow

            Principal:
              Service: cloudfront.amazonaws.com

            Action:
              - s3:GetObject

            Resource: !Sub "${FrontendBucket.Arn}/*"

            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  BucketName:
    Value: !Ref FrontendBucket

  CloudFrontDomain:
    Value: !GetAtt FrontendDistribution.DomainName
