AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Advitigudagudi Auth Service - Foundation

Parameters:
  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID

  GoogleClientSecretArn:
    Type: String
    Description: ARN of Google client secret in Secrets Manager

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64

Resources:
  #########################################################
  # DynamoDB
  #########################################################

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: advitigudagudi-auth-users-dev

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S

      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  #########################################################
  # EventBridge
  #########################################################

  PhotoShareEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: advitigudagudi-auth-PhotoShareBus

  #########################################################
  # DLQ
  #########################################################

  AuthServiceDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: auth-service-dlq-dev

  #########################################################
  # Cognito User Pool
  #########################################################

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: advitigudagudi-user-pool

      AutoVerifiedAttributes:
        - email

      UsernameAttributes:
        - email

      Schema:
        - Name: email
          Required: true
          Mutable: true

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  #########################################################
  # Google Identity Provider
  #########################################################

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      ProviderName: Google

      ProviderType: Google

      UserPoolId: !Ref UserPool

      ProviderDetails:
        client_id: !Ref GoogleClientId

        client_secret: !Sub "{{resolve:secretsmanager:${GoogleClientSecretArn}:SecretString:clientSecret}}"

        authorize_scopes: "email openid profile"

      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name
        name: name

  #########################################################
  # Cognito App Client
  #########################################################

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    DependsOn:
      - GoogleIdentityProvider

    Properties:
      ClientName: advitigudagudi-client

      UserPoolId: !Ref UserPool

      GenerateSecret: false

      SupportedIdentityProviders:
        - COGNITO
        - Google

      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

      AllowedOAuthFlowsUserPoolClient: true

      AllowedOAuthFlows:
        - implicit

      AllowedOAuthScopes:
        - email
        - openid
        - profile

      CallbackURLs:
        - http://localhost:3000

      LogoutURLs:
        - http://localhost:3000

  #########################################################
  # Cognito Domain
  #########################################################

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "advitigudagudi-auth-${AWS::AccountId}"

      UserPoolId: !Ref UserPool

  #########################################################
  # Lambda IAM Role
  #########################################################

  PostConfirmationFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: DynamoWritePolicy

          PolicyDocument:
            Version: "2012-10-17"

            Statement:
              - Effect: Allow

                Action:
                  - dynamodb:PutItem

                Resource: !GetAtt UsersTable.Arn

              - Effect: Allow

                Action:
                  - sqs:SendMessage

                Resource: !GetAtt AuthServiceDLQ.Arn

  #########################################################
  # Lambda Function
  #########################################################

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: advitigudagudi-post-confirmation

      CodeUri: ./

      Handler: dist/postConfirmation.handler

      Role: !GetAtt PostConfirmationFunctionRole.Arn

      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          EVENT_BUS_NAME: !Ref PhotoShareEventBus

      DeadLetterQueue:
        Type: SQS

        TargetArn: !GetAtt AuthServiceDLQ.Arn

      Events:
        CognitoPostConfirmation:
          Type: Cognito

          Properties:
            UserPool: !Ref UserPool

            Trigger: PostConfirmation

  #########################################################
  # Lambda Permission
  #########################################################

  PostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction

      Action: lambda:InvokeFunction

      Principal: cognito-idp.amazonaws.com

      SourceArn: !GetAtt UserPool.Arn

Outputs:
  CognitoUserPoolId:
    Value: !Ref UserPool

    Export:
      Name: CognitoUserPoolId

  CognitoUserPoolArn:
    Value: !GetAtt UserPool.Arn

    Export:
      Name: CognitoUserPoolArn

  CognitoUserPoolClientId:
    Value: !Ref UserPoolClient

    Export:
      Name: CognitoUserPoolClientId

  CognitoDomain:
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"

  UsersTableName:
    Value: !Ref UsersTable

    Export:
      Name: UsersTableName

  PhotoShareBusName:
    Value: !Ref PhotoShareEventBus

    Export:
      Name: PhotoShareBusName

  PhotoShareBusArn:
    Value: !GetAtt PhotoShareEventBus.Arn

    Export:
      Name: PhotoShareBusArn

  DLQUrl:
    Value: !Ref AuthServiceDLQ

    Export:
      Name: AuthServiceDLQUrl
