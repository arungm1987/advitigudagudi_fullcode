AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Advitigudagudi Auth Service - Production Foundation

Parameters:
  CognitoDomainPrefix:
    Type: String
    Default: advitigudagudi-auth
    Description: Unique prefix for the Hosted UI login page.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID
  GoogleClientSecretArn:
    Type: String
    Description: Secrets Manager ARN containing the Google client secret JSON (key: clientSecret)

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        USERS_TABLE_NAME: !Sub "${AWS::StackName}-users-${Environment}"
        EVENT_BUS_NAME: !Sub "${AWS::StackName}-PhotoShareBus"
        DLQ_URL: !Ref AuthServiceDLQ

Resources:
  PhotoShareEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${AWS::StackName}-PhotoShareBus"

  AuthServiceDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "auth-service-dlq-${Environment}"
      MessageRetentionPeriod: 1209600

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-users-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailGSI
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "auth-service-postconfirmation-${Environment}"
      Handler: dist/handlers/postConfirmation.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AuthServiceDLQ.QueueName
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref PhotoShareEventBus
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/auth-service-postconfirmation-${Environment}:*'
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: '*'
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTable
          EVENT_BUS_NAME: !Ref PhotoShareEventBus
          DLQ_URL: !Ref AuthServiceDLQ

  # Grant Cognito permission to invoke the PostConfirmation Lambda
  PostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PostConfirmationFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # Cognito User Pool and related resources
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${CognitoDomainPrefix}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: web-client
      UserPoolId: !Ref UserPool
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
        - Google
      CallbackURLs: []
      LogoutURLs: []

  # Google Identity Provider (uses dynamic Secrets Manager reference for client secret)
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref UserPool
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Join ['', ['{{resolve:secretsmanager:', !Ref GoogleClientSecretArn, ':SecretString:clientSecret}}']]
        authorize_scopes: 'profile email openid'

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolArn"

  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"

  HostedUIDomain:
    Description: Hosted UI domain (use for Google redirect)
    Value: !GetAtt UserPoolDomain.Domain
    Export:
      Name: !Sub "${AWS::StackName}-HostedUIDomain"

  PhotoShareBusName:
    Value: !GetAtt PhotoShareEventBus.Name
    Export:
      Name: !Sub "${AWS::StackName}-PhotoShareBusName"
