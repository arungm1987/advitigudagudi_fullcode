Resources:
  #########################################################
  # Existing Resources
  #########################################################

  UserTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: advitigudagudi-users

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S

      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  UserEventsDLQ:
    Type: AWS::SQS::Queue

    Properties:
      QueueName: advitigudagudi-user-events-dlq

  UserEventBus:
    Type: AWS::Events::EventBus

    Properties:
      Name: advitigudagudi-user-event-bus

  #########################################################
  # Cognito
  #########################################################

  UserPool:
    Type: AWS::Cognito::UserPool

    Properties:
      UserPoolName: advitigudagudi-user-pool

      AutoVerifiedAttributes:
        - email

      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    Properties:
      ClientName: advitigudagudi-user-pool-client

      UserPoolId: !Ref UserPool

      GenerateSecret: false

      AllowedOAuthFlowsUserPoolClient: true

      AllowedOAuthFlows:
        - code

      AllowedOAuthScopes:
        - openid
        - email
        - profile

      SupportedIdentityProviders:
        - Google
        - COGNITO

      CallbackURLs:
        - http://localhost:3000/auth/callback
        - https://d18mnuhklzfs5r.cloudfront.net/auth/callback

      LogoutURLs:
        - http://localhost:3000
        - https://d18mnuhklzfs5r.cloudfront.net

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider

    Properties:
      ProviderName: Google

      ProviderType: Google

      UserPoolId: !Ref UserPool

      ProviderDetails:
        client_id: "{{resolve:ssm:/advitigudagudi/google/client/id}}"
        client_secret: "{{resolve:ssm:/advitigudagudi/google/client/secret}}"
        authorize_scopes: "openid email profile"

      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name
        name: name

  #########################################################
  # IAM Roles
  #########################################################

  PostConfirmationFunctionRole:
    Type: AWS::IAM::Role

    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: PostConfirmationPolicy

          PolicyDocument:
            Version: "2012-10-17"

            Statement:
              - Effect: Allow

                Action:
                  - dynamodb:PutItem

                Resource: !GetAtt UserTable.Arn

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource: !GetAtt UserEventBus.Arn

  #########################################################
  # NEW ROLE FOR PROTECTED API
  #########################################################

  GetCurrentUserFunctionRole:
    Type: AWS::IAM::Role

    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  #########################################################
  # Existing Lambda
  #########################################################

  PostConfirmationFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: advitigudagudi-post-confirmation

      CodeUri: ./

      Handler: dist/handlers/postConfirmation.handler

      Runtime: nodejs20.x

      Timeout: 10

      MemorySize: 256

      Role: !GetAtt PostConfirmationFunctionRole.Arn

      Environment:
        Variables:
          USER_TABLE_NAME: !Ref UserTable
          EVENT_BUS_NAME: !Ref UserEventBus

  #########################################################
  # NEW PROTECTED AUTH API
  #########################################################

  GetCurrentUserFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: advitigudagudi-get-current-user

      CodeUri: ./

      Handler: dist/handlers/getCurrentUser.handler

      Runtime: nodejs20.x

      Timeout: 10

      MemorySize: 256

      Role: !GetAtt GetCurrentUserFunctionRole.Arn

      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_APP_CLIENT_ID: !Ref UserPoolClient

      Events:
        GetCurrentUserApi:
          Type: Api

          Properties:
            Path: /auth/me
            Method: GET

Outputs:
  #########################################################
  # Existing Outputs
  #########################################################

  UserPoolId:
    Value: !Ref UserPool

    Export:
      Name: UserPoolId

  UserPoolClientId:
    Value: !Ref UserPoolClient

    Export:
      Name: UserPoolClientId
  #########################################################
  # NEW AUTH ME API OUTPUT
  #########################################################

  AuthMeApi:
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/me"

    Export:
      Name: AuthMeApi
