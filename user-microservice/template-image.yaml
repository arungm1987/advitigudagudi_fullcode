AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: User microservice packaged as Lambda container images (arm64)

Parameters:
  PostConfirmationImage:
    Type: String
  GetUsersImage:
    Type: String

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  UserProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: advitigudagudi-user-service-Profiles
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref PostConfirmationImage
      Architectures: [arm64]
      Events:
        TestApi:
          Type: Api
          Properties:
            Path: /test-registration
            Method: post
      Environment:
        Variables:
          USER_PROFILES_TABLE_NAME: !Ref UserProfilesTable
          EVENT_BUS_NAME: PhotoShareEventBus
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTable
        - EventBridgePutEventsPolicy:
            EventBusName: PhotoShareEventBus

  GetUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref GetUsersImage
      Architectures: [arm64]
      Events:
        GetUsers:
          Type: Api
          Properties:
            Path: /users
            Method: get
      Environment:
        Variables:
          USER_PROFILES_TABLE_NAME: !Ref UserProfilesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTable

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
