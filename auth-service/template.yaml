AWSTemplateFormatVersion: "2010-09-09"

Transform: AWS::Serverless-2016-10-31

Description: Advitigudagudi Authentication Service

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256

Parameters:
  GoogleClientId:
    Type: String

  GoogleClientSecret:
    Type: String
    NoEcho: true

Resources:
  #########################################################
  # Cognito User Pool
  #########################################################

  UserPool:
    Type: AWS::Cognito::UserPool

    Properties:
      UserPoolName: advitigudagudi-users

      AutoVerifiedAttributes:
        - email

      UsernameAttributes:
        - email

  #########################################################
  # Google Identity Provider
  #########################################################

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider

    Properties:
      ProviderName: Google

      ProviderType: Google

      UserPoolId: !Ref UserPool

      AttributeMapping:
        email: email

        given_name: given_name

        family_name: family_name

      ProviderDetails:
        client_id: !Ref GoogleClientId

        client_secret: !Ref GoogleClientSecret

        authorize_scopes: "openid email profile"

  #########################################################
  # User Pool Client
  #########################################################

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    DependsOn:
      - GoogleIdentityProvider

    Properties:
      UserPoolId: !Ref UserPool

      ClientName: advitigudagudi-client

      GenerateSecret: false

      AllowedOAuthFlowsUserPoolClient: true

      AllowedOAuthFlows:
        - code

        - implicit

      AllowedOAuthScopes:
        - email

        - openid

        - profile

      SupportedIdentityProviders:
        - Google

        - COGNITO

      CallbackURLs:
        - http://localhost:3000/auth/callback

        - https://dev.advitigudagudi.com/auth/callback

        - https://d18mnuhklzfs5r.cloudfront.net/auth/callback

      LogoutURLs:
        - http://localhost:3000

        - https://dev.advitigudagudi.com

        - https://d18mnuhklzfs5r.cloudfront.net

  #########################################################
  # Cognito Domain
  #########################################################

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain

    Properties:
      Domain: advitigudagudi-auth-dev

      UserPoolId: !Ref UserPool

  #########################################################
  # Post Confirmation Lambda
  #########################################################

  PostConfirmationFunction:
    Type: AWS::Serverless::Function

    Properties:
      Handler: src/handlers/postConfirmation.handler

      CodeUri: .

      Policies:
        - AWSLambdaBasicExecutionRole

      Events:
        PostConfirmation:
          Type: Cognito

          Properties:
            UserPool: !Ref UserPool

            Trigger: PostConfirmation

    Metadata:
      BuildMethod: esbuild

      BuildProperties:
        Minify: true

        Target: es2020

        Sourcemap: true

        EntryPoints:
          - src/handlers/postConfirmation.ts

  #########################################################
  # Get Current User Lambda
  #########################################################

  GetCurrentUserFunction:
    Type: AWS::Serverless::Function

    Properties:
      Handler: src/handlers/getCurrentUser.handler

      CodeUri: .

      Policies:
        - AWSLambdaBasicExecutionRole

      Events:
        GetCurrentUserApi:
          Type: Api

          Properties:
            Path: /auth/me

            Method: GET

    Metadata:
      BuildMethod: esbuild

      BuildProperties:
        Minify: true

        Target: es2020

        Sourcemap: true

        EntryPoints:
          - src/handlers/getCurrentUser.ts

Outputs:
  UserPoolId:
    Value: !Ref UserPool

  UserPoolClientId:
    Value: !Ref UserPoolClient
