AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Auth Service - Cognito + PostConfirmation + EventBridge

Parameters:
  Environment:
    Type: String
    Default: dev

  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID

  GoogleClientSecretArn:
    Type: String
    Description: "AWS Secrets Manager ARN containing Google client secret JSON (key: clientSecret)"

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Timeout: 30
    MemorySize: 512
    Tracing: Active

Resources:

  #############################################
  # EventBridge Bus
  #############################################

  PhotoShareEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: advitigudagudi-auth-PhotoShareBus

  #############################################
  # DLQ
  #############################################

  AuthServiceDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: auth-service-dlq-dev
      MessageRetentionPeriod: 1209600

  #############################################
  # DynamoDB
  #############################################

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: advitigudagudi-auth-users-dev
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S

      KeySchema:
        - AttributeName: userId
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: EmailGSI
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  #############################################
  # Lambda Function
  #############################################

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: auth-service-postconfirmation-dev

      CodeUri: ./

      Handler: dist/handlers/postConfirmation.handler

      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTable
          DLQ_URL: !Ref AuthServiceDLQ
          EVENT_BUS_NAME: !Ref PhotoShareEventBus

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

        - SQSSendMessagePolicy:
            QueueName: !GetAtt AuthServiceDLQ.QueueName

        - Statement:
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt PhotoShareEventBus.Arn

        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"

        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"

  #############################################
  # Cognito User Pool
  #############################################

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: advitigudagudi-auth-user-pool

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  #############################################
  # Allow Cognito to Invoke Lambda
  #############################################

  PostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  #############################################
  # Google Identity Provider
  #############################################

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      ProviderName: Google
      ProviderType: Google

      UserPoolId: !Ref UserPool

      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Sub "{{resolve:secretsmanager:${GoogleClientSecretArn}:SecretString:clientSecret}}"
        authorize_scopes: "openid email profile"

      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name
        picture: picture

  #############################################
  # User Pool Client
  #############################################

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    DependsOn:
      - GoogleIdentityProvider

    Properties:
      UserPoolId: !Ref UserPool

      ClientName: web-client

      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      SupportedIdentityProviders:
        - COGNITO
        - Google

      CallbackURLs:
        - http://localhost:5173/auth/callback

      LogoutURLs:
        - http://localhost:5173

      AllowedOAuthFlowsUserPoolClient: true

      AllowedOAuthFlows:
        - code

      AllowedOAuthScopes:
        - openid
        - email
        - profile

  #############################################
  # Cognito Domain
  #############################################

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain

    DependsOn:
      - UserPoolClient

    Properties:
      Domain: !Sub "advitigudagudi-auth-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

Outputs:

  CognitoUserPoolId:
    Value: !Ref UserPool
    Export:
      Name: CognitoUserPoolId

  CognitoUserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: CognitoUserPoolArn

  CognitoUserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: CognitoUserPoolClientId

  CognitoDomain:
    Value: !Sub "https://advitigudagudi-auth-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"

  UsersTableName:
    Value: !Ref UsersTable
    Export:
      Name: UsersTableName

  PhotoShareBusName:
    Value: !Ref PhotoShareEventBus
    Export:
      Name: PhotoShareBusName

  PhotoShareBusArn:
    Value: !GetAtt PhotoShareEventBus.Arn
    Export:
      Name: PhotoShareBusArn

  DLQUrl:
    Value: !Ref AuthServiceDLQ
    Export:
      Name: AuthServiceDLQUrl